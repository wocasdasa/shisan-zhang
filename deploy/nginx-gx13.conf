# /etc/nginx/conf.d/gx13.conf
# 前端 wss://gx13.example.com/gx13 → 后端 127.0.0.1:8787（明文）
# 注意：proxy_pass 结尾的斜杠会把 /gx13 前缀去掉，服务端的 /health 才对得上

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gx13_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name gx13.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gx13.example.com;

    ssl_certificate     /etc/letsencrypt/live/gx13.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gx13.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location /gx13/ {
        proxy_pass http://gx13_backend/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # 长连接：别让 nginx 先掐掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
