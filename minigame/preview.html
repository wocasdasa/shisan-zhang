      ctx.restore();
    }

    txt(ctx, SEAT_NAMES[p], rect.x + 10 + ar * 2 + 8, rect.y + rect.h / 2 - 5, compact ? 14 : 16, active ? C.gold : C.text, 'left', 600);
    txt(ctx, g ? (count + ' 张') : '—', rect.x + 10 + ar * 2 + 8, rect.y + rect.h / 2 + 13, compact ? 12 : 13, C.dim, 'left');

    // 身份标记
    var rc = g ? (g.players[p].revealedCards || []) : [];
    var mw = rc.length * 40 + (rc.indexOf(3) >= 0 && rc.indexOf(14) >= 0 ? 50 : 0);
    var my = (p === 0) ? rect.y - 24 : rect.y + rect.h + 4;
    var bx = rect.x + rect.w / 2 - mw / 2 + 20;
    rc.forEach(function (r) {
      box(ctx, bx - 19, my, 38, 20, 5, 'rgba(201,169,97,0.16)', C.goldDim);
      txt(ctx, r === 3 ? '♠3' : '♠A', bx, my + 11, 12, C.gold, 'center');
      bx += 42;
    });
    if (rc.indexOf(3) >= 0 && rc.indexOf(14) >= 0) {
      box(ctx, bx - 24, my, 48, 20, 5, 'rgba(176,42,47,0.22)', 'rgba(176,42,47,0.55)');
      txt(ctx, '独食', bx, my + 11, 12, '#e8b0ae', 'center');
    }

    // 分数
    txt(ctx, (pts > 0 ? '+' : '') + pts, rect.x + rect.w - 10, rect.y + 15, compact ? 13 : 15,
      pts > 0 ? C.gold : pts < 0 ? '#d99a98' : C.dim, 'right', 600);
  }

  function seats(ctx, S, L, hits) {
    for (var p = 0; p < 4; p++) {
      if (p === 0 && S.phase === 'tribute') continue; // 进贡面板会盖住南家座位
      var rect = L.seats[SEAT_POS[p]];
      seatPlate(ctx, S, p, rect, hits);
      var pickable = S.tribute && S.tribute.stage === 'draw' && S.tribute.humanIsWinner &&
        S.tribute.plan.losers.indexOf(p) >= 0;
      if (pickable) {
        ctx.save();
        ctx.setLineDash([6, 4]);
        rr(ctx, rect.x - 4, rect.y - 4, rect.w + 8, rect.h + 8, 12);
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        hits.push({ x: rect.x - 6, y: rect.y - 6, w: rect.w + 12, h: rect.h + 12, act: 'drawSeat', p: p });
      }

      // 进贡阶段：对手的牌全部盖住，只留牌背；标出抽牌者/被抽者，抽到的牌亮在头像旁
      var TR = S.tribute;
      if (TR && S.phase === 'tribute') {
          var posNm = SEAT_POS[p];
          if (posNm !== 'north') {
            var bkx = rect.x + rect.w + 8, bky = rect.y + rect.h - 36;
            if (posNm === 'east') bkx = rect.x - 34;
            for (var bk = 0; bk < 3; bk++) {
              ctx.save();
              ctx.translate(bkx + bk * 4, bky + bk * 3);
              ctx.rotate(-0.1 + bk * 0.06);
              drawBack(ctx, 0, 0, 22, 30);
              ctx.restore();
            }
          }
          var isTurn = TR.turnW === p;
          var canPick = TR.stage === 'draw' && (TR.canDraw || []).indexOf(p) >= 0;
          var wasPicked = (TR.picks || []).indexOf(p) >= 0;
          if (isTurn) {
            var pulse = 0.45 + 0.45 * Math.sin(Date.now() / 300);
            ctx.save();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(233,184,77,' + pulse.toFixed(2) + ')';
            rr(ctx, rect.x - 7, rect.y - 7, rect.w + 14, rect.h + 14, 12);
            ctx.stroke();
            ctx.restore();
            txt(ctx, '抽牌中…', rect.x + rect.w / 2, rect.y - 13, 12, C.gold, 'center', 600);
          } else if (canPick) {
            var pulse2 = 0.55 + 0.4 * Math.sin(Date.now() / 240);
            ctx.save();
            if (ctx.setLineDash) ctx.setLineDash([6, 5]);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = 'rgba(233,184,77,' + pulse2.toFixed(2) + ')';
            rr(ctx, rect.x - 9, rect.y - 9, rect.w + 18, rect.h + 18, 14);
            ctx.stroke();
            ctx.restore();
            if (posNm !== 'north') {
              var bx1 = rect.x + rect.w / 2;
              box(ctx, bx1 - 34, rect.y - 32, 68, 22, 11, 'rgba(233,184,77,0.95)', null);
              txt(ctx, '点我抽牌', bx1, rect.y - 21, 12, '#3b2a08', 'center', 600);
            }
          } else if (wasPicked) {
            box(ctx, rect.x - 2, rect.y + rect.h - 2, 40, 18, 6, 'rgba(176,42,47,0.92)', null);
            txt(ctx, '已抽', rect.x + 18, rect.y + rect.h + 7, 11, '#ffe9e0', 'center', 600);
          }
          // 被抽走的牌挂在他座位旁（亮出来）
          var got = (TR.draws || []).filter(function (d) { return d.from === p; }).slice(-3);
          got.forEach(function (d, gi) {
            var gx2 = rect.x + rect.w + 10 + gi * 6;
            if (gx2 + 34 > W - 8) gx2 = rect.x - 40 - gi * 6;
            var gy2 = rect.y + 6 + gi * 8;
            drawCard(ctx, gx2, gy2, 34, 44, d.card, { mark: true });
          });
      }
      // 轮到谁出牌：时钟浮在他头上（自己的回合在底部按钮条里显示）
      if (p !== 0 && S.phase === 'play' && S.game && !S.game.over && S.game.turn === p) {
        var posName = SEAT_POS[p];
        var cx0 = rect.x + rect.w / 2;
        var cy0 = posName === 'north' ? rect.y + rect.h + 22 : rect.y - 24;
        if (posName === 'south') { cx0 = rect.x + rect.w + 26; cy0 = rect.y + rect.h / 2; }
        var r0 = 17;
        var hasTimer = S.timer.left > 0;
        var warn = hasTimer && S.timer.left <= 5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx0, cy0, r0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,250,240,0.95)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = warn ? '#d8412f' : '#e9b84d';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx0 - r0 * 0.44, cy0 - r0 * 0.94, r0 * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = warn ? '#d8412f' : '#e9b84d';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx0 + r0 * 0.44, cy0 - r0 * 0.94, r0 * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (hasTimer) {
          txt(ctx, String(S.timer.left), cx0, cy0 + 5, 15, warn ? '#d8412f' : '#5a3a12', 'center', 700);
        } else {
          var ang = (Date.now() % 1200) / 1200 * Math.PI * 2;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(cx0, cy0);
          ctx.lineTo(cx0 + Math.cos(ang - Math.PI / 2) * (r0 - 7), cy0 + Math.sin(ang - Math.PI / 2) * (r0 - 7));
          ctx.strokeStyle = '#5a3a12';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  }

  // ---------- 桌面：本轮所有出牌 ----------
  function center(ctx, S, L, hits) {
    var g = S.game;
    var cy = L.center.y;

    if (!g) {
      txt(ctx, '点右上「重开」开始', W / 2, cy, 20, C.dim);
      return;
    }

    var ds = dealState(S);
    if (ds && !ds.done) { dealTable(ctx, S, L, ds); return; }

    var plays = g.trickPlays || [];
    if (!plays.length) {
      txt(ctx, S.phase === 'play' && g.turn >= 0 ? SEAT_NAMES[g.turn] + ' 起手' : '', W / 2, cy, 19, C.dim);
      return;
    }

    var newest = plays[plays.length - 1];
    var hist = plays.slice(0, -1).slice(-4);

    // 最新一手：放大居中
    var n = newest.cards.length;
    var gap = n >= 8 ? 6 : 12;
    var maxW = L.landscape ? Math.min(W - 220, 480) : Math.min(W - 280, 430);
    var chCap = L.landscape
      ? Math.max(56, (L.hand.y - 50 - 44 - 6) - (L.seats.north.y + L.seats.north.h) - 12)
      : 999;
    var cw = Math.floor((maxW - (n - 1) * gap) / n);
    cw = Math.max(28, Math.min(cw, Math.floor(chCap / 1.38), n <= 2 ? 96 : n <= 5 ? 70 : 48));
    var ch = Math.round(cw * 1.38);
    var blockW = n * cw + (n - 1) * gap;
    var cxB = W / 2;
    var x0 = cxB - blockW / 2;
    var yTop = Math.max(cy - ch / 2, L.seats.north.y + L.seats.north.h + 26);
    yTop = Math.min(yTop, L.hand.y - ch - 74);

    var raw = fxProgress(S, 'playT0', 300);
    if (raw < 0.58) {
      var prog = easeOut(raw / 0.58);
      var from = L.seats[SEAT_POS[newest.player]];
      var fx0 = from.x + from.w / 2, fy0 = from.y + from.h / 2;
      var fx1 = cxB, fy1 = yTop + ch / 2;
      var gx = fx0 + (fx1 - fx0) * prog;
      var gy = fy0 + (fy1 - fy0) * prog;
      var gw = cw * (0.58 + 0.42 * prog), gh = ch * (0.58 + 0.42 * prog);
      var mk = newest.cards[0].s === 3 && (newest.cards[0].r === 3 || newest.cards[0].r === 14);
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.45 * prog;
      ctx.translate(gx, gy);
      ctx.rotate((1 - prog) * (newest.player === 0 ? -0.16 : 0.16));
      for (var ci = newest.cards.length - 1; ci >= 0; ci--) {
        drawCard(ctx, -gw / 2 + ci * 9, -gh / 2 - ci * 3, gw, gh, newest.cards[ci],
          { mark: ci === 0 && mk });
      }
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.fillStyle = 'rgba(4,26,17,0.30)';
    rr(ctx, x0 - 16, yTop - 34, blockW + 32, ch + 52, 10);
    ctx.fill();
    ctx.restore();
    txt(ctx, SEAT_NAMES[newest.player] + (newest.combo ? ' · ' + kindLabel(newest.combo.kind) : ''),
      W / 2, yTop - 16, 13, C.gold, 'center', 600);

    newest.cards.forEach(function (c, i) {
      var mark = c.s === 3 && (c.r === 3 || c.r === 14);
      drawCard(ctx, x0 + i * (cw + gap), yTop, cw, ch, c, { mark: mark });
    });

    // 本轮之前的出牌：缩到最新一手右侧横排，保证一轮没结束前都看得到
    if (hist.length) {
      var hw = 26, hh = 34, hgap = 2;
      var hx = x0 + blockW + 20;
      var hy = yTop + 10;
      var maxX = W - 148;
      hist.forEach(function (pl) {
        var bw = pl.cards.length * (hw + hgap);
        if (hx + bw > maxX) return;
        box(ctx, hx - 4, hy - 4, bw + 8, hh + 8, 5, 'rgba(4,26,17,0.35)', 'rgba(201,169,97,0.22)');
        pl.cards.forEach(function (c, i) {
          var mark = c.s === 3 && (c.r === 3 || c.r === 14);
          drawCard(ctx, hx + i * (hw + hgap), hy, hw, hh, c, { mark: mark });
        });
        txt(ctx, SEAT_NAMES[pl.player].charAt(0), hx + 1, hy + hh + 12, 10, C.dim, 'left');
        hx += bw + 16;
      });
    }
  }

  // 发牌：牌堆 + 飞向座位的牌背
  function dealTable(ctx, S, L, ds) {
    var cy = L.center.y;
    var dw = 68, dh = 94;
    var dx = W / 2 - dw / 2, dy = cy - dh / 2;

    var left = ds.left;
    for (var i = 0; i < Math.min(4, left); i++) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      drawBack(ctx, dx + i * 3, dy - i * 3, dw, dh);
      ctx.restore();
    }
    txt(ctx, '发牌中 · 点击跳过', W / 2, cy + dh / 2 + 34, 16, C.dim);

    if (ds.flying) {
      var seat = ds.flying.seat;
      var pos = SEAT_POS[seat];
      var r = L.seats[pos];
      var tx = r.x + r.w / 2, ty = r.y - 6;
      var p = easeOut(ds.flying.prog);
      var fx = dx + dw / 2 + (tx - (dx + dw / 2)) * p;
      var fy = dy + dh / 2 + (ty - (dy + dh / 2)) * p;
      var sc = 0.82 - 0.18 * p;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate((1 - p) * (seat === 0 ? -0.18 : 0.18));
      ctx.globalAlpha = 0.95;
      drawBack(ctx, -dw * sc / 2, -dh * sc / 2, dw * sc, dh * sc);
      ctx.restore();
    }
  }

  function kindLabel(kind) {
    var m = {
      single: '单张', pair: '对子', trio: '三张', straight: '顺子',
      flush: '同花', fullhouse: '三带二', four: '四张', straightflush: '同花顺'
    };
    return m[kind] || kind;
  }

  // ---------- 手牌 ----------
  function hand(ctx, S, L, hits) {
    var g = S.game;
    var mine = g ? g.players[0].hand : [];
    var ds = dealState(S);
    var n = ds && !ds.done ? Math.min(mine.length, ds.arrived[0]) : mine.length;
    var avail = W - 320 - L.hand.cardW;
    var step = n > 1 ? Math.min(L.hand.step, Math.max(26, avail / (n - 1))) : L.hand.step;
    var totalW = (n - 1) * step + L.hand.cardW;
    var hx = Math.max(150, Math.round((W - totalW) / 2));

    mine.slice(0, n).forEach(function (c, i) {
      var sel = S.selected.some(function (s) { return s.r === c.r && s.s === c.s; });
      var x = hx + i * step;
      var y = L.hand.y - (sel ? 20 : 0);
      drawCard(ctx, x, y, L.hand.cardW, L.hand.cardH, c, { mark: sel });
      hits.push({ x: x, y: y, w: Math.min(step, L.hand.cardW), h: L.hand.cardH, act: 'card', i: i });
    });

    // 最后一张补足宽度
    if (n) {
      var lastX = hx + (n - 1) * step;
      hits.push({ x: lastX + step, y: L.hand.y, w: Math.max(0, L.hand.cardW - step), h: L.hand.cardH, act: 'card', i: n - 1 });
    }
  }

  // ---------- 操作区 ----------
  function actions(ctx, S, L, hits) {
    var g = S.game;
    var can = S.phase === 'play' && g && !g.over && g.turn === 0 && !S.busy;

    // 只有轮到自己才浮出操作条
    if (!can) return;

    var barH = 44;
    var barY = L.landscape ? (L.hand.y - barH - 8) : (L.hand.y - barH - 12);
    var wPass = 108, wHint = 108, wPlay = 126, rClock = 24, gapB = 12;
    var total = wPass + gapB + rClock * 2 + gapB + wHint + gapB + wPlay;
    var bx = Math.round(W / 2 - total / 2);

    pill(ctx, bx, barY, wPass, barH, '不出', can && g && !!g.combo, hits, 'pass', 'gold');
    bx += wPass + gapB;

    clockChip(ctx, bx + rClock, barY + barH / 2, rClock, S.timer.left, S.phase === 'play');
    bx += rClock * 2 + gapB;

    pill(ctx, bx, barY, wHint, barH, '提示', can, hits, 'hint', 'gold');
    bx += wHint + gapB;

    pill(ctx, bx, barY, wPlay, barH, '出牌', can, hits, 'play', 'blue');
  }

  function pill(ctx, x, y, w, h, label, enabled, hits, act, tone) {
    var r = h / 2;
    var fill = !enabled ? 'rgba(26,42,34,0.55)' : tone === 'blue' ? '#3b86d8' : '#e9b84d';
    var line = !enabled ? 'rgba(201,169,97,0.14)' : tone === 'blue' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.5)';
    box(ctx, x, y, w, h, r, fill, line);
    if (enabled) {
      ctx.save();
      var lg = ctx.createLinearGradient(0, y, 0, y + h);
      lg.addColorStop(0, 'rgba(255,255,255,0.45)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.08)');
      lg.addColorStop(1, 'rgba(0,0,0,0.12)');
      rr(ctx, x, y, w, h, r);
      ctx.fillStyle = lg;
      ctx.fill();
      ctx.restore();
    }
    txt(ctx, label, x + w / 2, y + h / 2 + 1, 18,
      enabled ? (tone === 'blue' ? '#ffffff' : '#4a2f08') : 'rgba(239,234,219,0.4)', 'center', 600);
    if (enabled) hits.push({ x: x, y: y, w: w, h: h, act: act });
  }

  function clockChip(ctx, cx, cy, r, left, active) {
    var leftN = Math.max(0, left || 0);
    var warn = active && leftN <= 5;
    var ring = warn ? '#d8412f' : '#e9b84d';
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? '#fffaf0' : 'rgba(255,255,255,0.34)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = ring;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - r * 0.46, cy - r * 0.94, r * 0.19, 0, Math.PI * 2);
    ctx.fillStyle = ring;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + r * 0.46, cy - r * 0.94, r * 0.19, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    txt(ctx, String(leftN), cx, cy + r * 0.3, Math.round(r * 0.92),
      warn ? '#d8412f' : '#5a3a12', 'center', 700);
  }

  function btn(ctx, x, y, w, h, label, enabled, hits, act, primary) {
    if (primary && enabled) {
      box(ctx, x, y, w, h, 10, C.gold, null);
      txt(ctx, label, x + w / 2, y + h / 2, 21, '#132018', 'center', 600);
    } else {
      box(ctx, x, y, w, h, 10, enabled ? C.btn : 'rgba(20,40,30,0.6)',
        enabled ? C.panelLine : 'rgba(201,169,97,0.12)');
      txt(ctx, label, x + w / 2, y + h / 2, 21, enabled ? C.text : 'rgba(239,234,219,0.35)');
    }
    if (enabled) hits.push({ x: x, y: y, w: w, h: h, act: act });
  }

  // ---------- 进贡面板 ----------
  function cardTxt(c) {
    var r = c.r === 11 ? 'J' : c.r === 12 ? 'Q' : c.r === 13 ? 'K' : c.r === 14 ? 'A' : String(c.r);
    return SUIT[c.s] + r;
  }

  function tribute(ctx, S, L, hits) {
    var T = S.tribute;
    if (!T) return;
    var land = L.landscape;
    var H = L.H;

    var barH = 44;
    var barW = Math.min(W - 56, 700);
    var barX = (W - barW) / 2;
    var barY = L.hand.y - 56;

    // 底部状态条（不遮挡牌桌中央）
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 14;
    box(ctx, barX, barY, barW, barH, 14, 'rgba(8,30,22,0.96)', 'rgba(201,169,97,0.4)');
    ctx.restore();

    var cnt = (T.pull && (T.pull.total || T.pull.count)) || T.need || (T.plan && T.plan.count) || 0;
    var retTotal = (T.ret && T.ret.total) || (T.retQueue || []).length || 0;
    var retIdx = (T.ret && typeof T.ret.idx === 'number') ? T.ret.idx : (T.retIdx || 0);
    var retFrom = (T.ret && typeof T.ret.curFrom === 'number') ? T.ret.curFrom
      : ((T.retQueue && T.retQueue[T.retIdx]) ? T.retQueue[T.retIdx].from : -1);
    var prog = '进贡完成';
    if (T.stage === 'draw') prog = T.humanIsWinner ? '点金框的对手抽牌' : '等待对手抽牌';
    else if (T.stage === 'pull') prog = '点牌背抽牌（' + ((T.pull && T.pull.done) || 0) + '/' + cnt + '）';
    else if (T.stage === 'return') {
      prog = '还贡 ' + Math.min(retIdx + 1, retTotal) + '/' + retTotal + ' → 还给 ' + (retFrom >= 0 ? SEAT_NAMES[retFrom] : '')
        + ((S.selected || []).length ? ' · 已选 ' + S.selected.length + ' 张' : '');
    }

    txt(ctx, '第 ' + S.round + ' 局 · 进贡', barX + 16, barY + barH / 2, 15, C.gold, 'left', 600);
    txt(ctx, prog, barX + barW / 2 - 40, barY + barH / 2, 15, C.text, 'center', 600);

    // 还贡按钮（做出牌那种胶囊）：勾选完点这里才提交
    if (T.stage === 'return') {
      var selN = (S.selected || []).length;
      var bww = 148, bhh = 32;
      var bxx = barX + barW - bww - 8, byy = barY + (barH - bhh) / 2;
      var gd2 = ctx.createLinearGradient(0, byy, 0, byy + bhh);
      if (selN > 0) {
        gd2.addColorStop(0, '#f7dc86');
        gd2.addColorStop(0.55, '#e9b84d');
        gd2.addColorStop(1, '#cf9a2f');
      } else {
        gd2.addColorStop(0, '#9fb3a8');
        gd2.addColorStop(1, '#7d9188');
      }
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 8;
      box(ctx, bxx, byy, bww, bhh, bhh / 2, gd2, 'rgba(255,255,255,0.4)');
      ctx.restore();
      txt(ctx, selN > 0 ? ('还贡 (' + selN + ')') : '还贡', bxx + bww / 2, byy + bhh / 2 + 1, 14.5,
        selN > 0 ? '#3b2a08' : '#26352d', 'center', 700);
      hits.push({ x: bxx, y: byy, w: bww, h: bhh, act: 'confirmReturn' });
    }

    // 最近一条公示：谁被抽走了什么，所有人都能看到
    var lastLog = (T.log || []).slice(-1)[0];
    if (lastLog) {
      txt(ctx, lastLog.text, W / 2, barY - 15, 12.5,
        lastLog.kind === 'warn' ? '#f3b7b2' : C.dim, 'center');
    }

    // 摊牌：被抽者整手牌背面朝上摊开（独食三家同时摊三排），点任意一张抽走
    if (T.stage === 'pull' && T.pull && T.pull.rows) {
      var rows = T.pull.rows;
      var nMax = 1;
      rows.forEach(function (r) { if (r.n > nMax) nMax = r.n; });
      var gp2 = 6;
      var maxPw = rows.length >= 3 ? 38 : (rows.length === 2 ? 42 : 46);
      var fitPw = Math.floor((Math.min(W - 120, 680) - (nMax - 1) * gp2) / nMax);
      var pw = Math.max(16, Math.min(maxPw, fitPw));
      var phh = Math.round(pw * 1.4);
      var rowGap = rows.length >= 3 ? 12 : 22;
      var blockH = rows.length * phh + (rows.length - 1) * rowGap;
      var top = L.center.y - blockH / 2 - 2;

      rows.forEach(function (row, ri) {
        var n = Math.max(1, row.n);
        var totalW = n * pw + (n - 1) * gp2;
        var sx = Math.max(104, (W - totalW) / 2);
        var sy = top + ri * (phh + rowGap);

        box(ctx, sx - 92, sy - 4, 80, phh + 8, 9, 'rgba(6,26,18,0.62)', 'rgba(201,169,97,0.28)');
        txt(ctx, SEAT_NAMES[row.rel], sx - 52, sy + phh / 2 - 5, 13, C.gold, 'center', 600);
        txt(ctx, row.n + ' 张', sx - 52, sy + phh / 2 + 11, 11.5, C.dim, 'center');

        for (var i = 0; i < n; i++) {
          var cx2 = sx + i * (pw + gp2);
          drawBack(ctx, cx2, sy, pw, phh);
          hits.push({ x: cx2 - 2, y: sy - 4, w: pw + 4, h: phh + 8, act: 'pullCard', p: row.rel, idx: i });
        }
      });

      var doneTxt = '已抽 ' + (T.pull.done || 0) + ' / ' + (T.pull.total || 0) + ' 张';
      txt(ctx, doneTxt, W / 2, top + blockH + 18, 12.5, C.dim, 'center');
    }
  }
  // ---------- 结算 ----------
  function overlay(ctx, H, w, h) {
    ctx.fillStyle = 'rgba(3,12,8,0.72)';
    ctx.fillRect(0, 0, W, H);
  }

  function settle(ctx, S, L, hits) {
    var res = S.lastResult;
    if (!res) return;
    var H = L.H;
    var e = easeOut(fxProgress(S, 'settleT0', 300));
    ctx.save();
    if (e < 1) {
      ctx.globalAlpha = e;
      ctx.translate(0, 22 * (1 - e));
    }
    overlay(ctx, H, W, H);

    var pw = 660, ph = 520;
    var px = (W - pw) / 2, py = (H - ph) / 2 - 40;
    box(ctx, px, py, pw, ph, 16, C.panel, C.panelLine);

    var title = res.camp.mode === 'lone' ? '本局：独食 1 打 3' : '本局：2 打 2';
    txt(ctx, title, W / 2, py + 52, 26, C.gold, 'center', 600);
    var sub = res.camp.mode === 'lone'
      ? '独食者 ' + SEAT_NAMES[res.camp.lone] + ' 拿第 ' + (res.ranks.indexOf(res.camp.lone) + 1) + ' 名'
      : '胜方名次 ' + res.winRanks.join('、');
    txt(ctx, sub, W / 2, py + 86, 16, C.dim);

    var cols = [px + 40, px + 200, px + 330, px + 470, px + 590];
    var hy = py + 128;
    ['名次', '玩家', '阵营', '本局', '累计'].forEach(function (label, i) {
      txt(ctx, label, cols[i], hy, 15, C.dim, i === 0 ? 'left' : 'center');
    });

    res.ranks.forEach(function (p, i) {
      var y = hy + 44 + i * 46;
      var team = res.camp.mode === 'lone'
        ? (p === res.camp.lone ? '独食' : '三人队')
        : (res.camp.teamA.indexOf(p) >= 0 ? '♠3/♠A' : '对方队');
      var mine = S.scores[p] !== undefined ? S.scores[p] : 0;
      txt(ctx, '第 ' + (i + 1), cols[0], y, 17, C.text, 'left');
      txt(ctx, SEAT_NAMES[p], cols[1], y, 17, C.text);
      txt(ctx, team, cols[2], y, 15, C.dim);
      var s = res.scores[p];
      txt(ctx, (s > 0 ? '+' : '') + s, cols[3], y, 17, s > 0 ? C.gold : s < 0 ? '#d99a98' : C.dim);
      txt(ctx, (mine > 0 ? '+' : '') + mine, cols[4], y, 17, mine > 0 ? C.gold : mine < 0 ? '#d99a98' : C.dim);
      ctx.strokeStyle = 'rgba(201,169,97,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px + 32, y + 24);
      ctx.lineTo(px + pw - 32, y + 24);
      ctx.stroke();
    });

    var isLast = S.round >= S.rounds;
    var bw = 240, bh = 58;
    box(ctx, W / 2 - bw / 2, py + ph - 92, bw, bh, 10, C.gold, null);
    txt(ctx, isLast ? '看总成绩' : '下一局', W / 2, py + ph - 63, 21, '#132018', 'center', 600);
    hits.push({ x: W / 2 - bw / 2, y: py + ph - 92, w: bw, h: bh, act: 'next' });
    ctx.restore();
  }

  function draw(ctx, S, H, wW) {
    if (wW) W = wW;
    var L = layout(H);
    var hits = [];
    bg(ctx, H);
    if (S.phase === 'menu' || (S.lobby && !S.game)) {
      menu(ctx, S, L, hits);
      if (S.lobby) lobbyPanel(ctx, S, L, hits);
      if (S.waitRoom) roomPanel(ctx, S, L, hits);
      if (S.toast) toast(ctx, S, L);
      return hits;
    }
    header(ctx, S, L, hits);
    seats(ctx, S, L, hits);
    center(ctx, S, L, hits);
    if (!S.lobby && !S.waitRoom) {
      hand(ctx, S, L, hits);
      actions(ctx, S, L, hits);
    }
    if (S.tribute) tribute(ctx, S, L, hits);
    if (S.phase === 'settle') settle(ctx, S, L, hits);
    fxOverlay(ctx, S, L, H);
    if (S.summary) summary(ctx, S, L, hits);
    if (S.lobby) lobbyPanel(ctx, S, L, hits);
    if (S.waitRoom) roomPanel(ctx, S, L, hits);
    if (S.toast) toast(ctx, S, L);
    return hits;
  }

    var rows = losersAll.map(function (r) { return { rel: r, n: S.game.players[r].hand.length }; });
    T.pull = { rows: rows, done: 0, total: T.need * rows.length, count: T.need, roundStart: (T.draws || []).length };
    S.hint = '点牌背抽一张';
    P.markDirty();
    return;
  }

  // 摊牌后点某家第 idx 张：抽走一张
  function pullOne(rel, idx) {
    var T = S.tribute;
    if (!T || T.stage !== 'pull' || !T.pull) return;
    if (S.mode === 'online') { NET.send({ t: 'pullPick', seatRel: rel, idx: idx }); return; }
    var p = rel;
    var hand = S.game.players[p].hand;
    if (!hand.length) return;
    var k = Math.max(0, Math.min(idx, hand.length - 1));
    var c = hand[k];
    if (GX.Tribute.isIdentity(c)) {
      T.reveals.push({ owner: p, card: c });
      T.log.push({ text: SEAT_NAMES[p] + ' 的 ' + suitRank(c) + ' 是身份牌，亮出归还后重抽', kind: 'warn' });
      S.game.players[p].revealed = true;
      S.game.players[p].revealedCards = (S.game.players[p].revealedCards || []).concat([c.r]);
      S.game.players[p].revealedCard = c.r;
      P.markDirty();
      return;
    }
    hand.splice(k, 1);
    S.game.players[0].hand.push(c);
    sortHand(S.game.players[0].hand);
    T.draws.push({ from: p, to: 0, card: c });
    T.humanDrawn.push({ from: p, card: c });
    T.log.push({ text: '从 ' + SEAT_NAMES[p] + ' 抽到 ' + suitRank(c), kind: 'draw' });
    T.pull.done++;
    (T.pull.rows || []).forEach(function (r) { if (r.rel === p) r.n = hand.length; });
    SFX.play('draw');
    S.fx.drawT0 = Date.now();
    if (T.pull.done >= (T.pull.total || T.need)) {
      // 抽满 → 还贡：按被抽走的牌从大到小，一张一张还
      var rq = (T.draws || []).slice(T.pull.roundStart || 0);
      rq.sort(function (a, b) {
        var d = (GX.Rules.rankVal(b.card.r, S.cfg.rankOrder) - GX.Rules.rankVal(a.card.r, S.cfg.rankOrder));
        return d || (a.card.s - b.card.s);
      });
      T.retQueue = rq;
      T.retIdx = 0;
      T.stage = 'return';
      S.hint = '逐张还贡（1/' + rq.length + '）';
    } else {
      S.hint = '再抽一张（' + T.pull.done + '/' + (T.pull.total || T.need) + '）';
    }
    P.markDirty();
    return;
  }

  function retRemaining() {
    var T = S.tribute;
    if (!T) return 0;
    if (T.ret) return Math.max(0, T.ret.total - T.ret.idx);
    return Math.max(0, (T.retQueue || []).length - (T.retIdx || 0));
  }

  // 还贡：点手牌只是勾选/取消，点「还贡」按钮才真正提交
  function toggleReturnSelect(c) {
    var T = S.tribute;
    if (!T || T.stage !== 'return' || !c) return;
    var at = -1;
    S.selected.forEach(function (x, i) { if (x.r === c.r && x.s === c.s) at = i; });
    if (at >= 0) {
      S.selected.splice(at, 1);
      S.hint = '已选 ' + S.selected.length + ' 张，点「还贡」提交';
      P.markDirty();
      return;
    }
    if (S.selected.length >= retRemaining()) {
      toast('还贡只剩 ' + retRemaining() + ' 张要还');
      return;
    }
    S.selected.push({ r: c.r, s: c.s });
    SFX.play('select');
    S.hint = '已选 ' + S.selected.length + ' 张，点「还贡」提交';
    P.markDirty();
  }

  // 本地逐张执行还贡（按 retQueue 顺序）
  function returnOneLocal(c) {
    var T = S.tribute;
    var cur = (T.retQueue || [])[T.retIdx];
    if (!cur) return;
    var hd = S.game.players[0].hand;
    var idx = hd.findIndex(function (x) { return x.r === c.r && x.s === c.s; });
    if (idx < 0) return;
    hd.splice(idx, 1);
    S.game.players[cur.from].hand.push({ r: c.r, s: c.s });
    sortHand(hd);
    T.returned.push({ from: 0, to: cur.from, card: { r: c.r, s: c.s } });
    T.log.push({ text: '还 ' + suitRank(c) + ' 给 ' + SEAT_NAMES[cur.from], kind: 'ret' });
    T.retIdx++;
  }

  function confirmReturn() {
    var T = S.tribute;
    if (!T || T.stage !== 'return') return;
    if (!S.selected.length) { toast('先选要还的牌，再点还贡'); return; }
    var left = retRemaining();
    if (S.selected.length > left) { toast('最多还能还 ' + left + ' 张'); return; }

    var cards = S.selected.slice();
    S.selected = [];
    if (S.mode === 'online') {
      NET.send({ t: 'retOne', cards: cards });
      P.markDirty();
      return;
    }
    cards.forEach(function (c) { returnOneLocal(c); });
    SFX.play('ret');
    S.fx.retT0 = Date.now();
    if (T.retIdx >= (T.retQueue || []).length) {
      T.stage = 'done';
      finishTribute();
    } else {
      S.hint = '还需要还 ' + retRemaining() + ' 张';
    }
    P.markDirty();
  }

  // 进贡分步执行：一次抽一张，面板上逐条可见
  var tributeTimer = null;

  function clearTributeTimer() {
    if (tributeTimer) { clearTimeout(tributeTimer); tributeTimer = null; }
  }

  function tributeSchedule(delay) {
    clearTributeTimer();
    tributeTimer = setTimeout(tributeStep, delay === undefined ? 420 : delay);
  }

  function aiJobPending(T) {
    for (var i = 0; i < T.plan.winners.length; i++) {
      var w = T.plan.winners[i];
      if (w === 0 && T.humanIsWinner) continue;
      if ((T.counts[i] || 0) < T.shares[i]) return { wi: i, w: w };
    }
    return null;
  }

  function aiReturnGift(T, w, target) {
    var mine = S.game.players[w].hand.slice()
      .filter(function (c) { return !GX.Tribute.isIdentity(c); })
      .sort(function (a, b) {
        return GX.Rules.rankVal(a.r, S.cfg.rankOrder) - GX.Rules.rankVal(b.r, S.cfg.rankOrder);
      });
    if (!mine.length) return;
    var give = mine[0];
    var i2 = S.game.players[w].hand.findIndex(function (x) { return sameCard(x, give); });
    if (i2 < 0) return;
    S.game.players[w].hand.splice(i2, 1);
    S.game.players[target].hand.push(give);
    T.log.push({ text: SEAT_NAMES[w] + ' 还贡 ' + suitRank(give) + ' 给 ' + SEAT_NAMES[target], kind: 'ret' });
  }

  function doTributeDraw(T, wi, w) {
    var plan = T.plan;
    var target = plan.losers[Math.floor(Math.random() * plan.losers.length)];
    var guard = 0;
    while (guard++ < 60) {
      var hand = S.game.players[target].hand;
      if (!hand.length) break;
      var idx = Math.floor(Math.random() * hand.length);
      var card = hand[idx];
      if (GX.Tribute.isIdentity(card)) {
        T.reveals.push({ owner: target, card: card });
        S.game.players[target].revealed = true;
        S.game.players[target].revealedCard = card.r;
        S.game.players[target].revealedCards = (S.game.players[target].revealedCards || []).concat([card.r]);
        T.log.push({ text: SEAT_NAMES[target] + ' 的 ' + suitRank(card) + ' 是身份牌，亮出归还后重抽', kind: 'warn' });
        continue;
      }
      hand.splice(idx, 1);
      S.game.players[w].hand.push(card);
      T.draws.push({ from: target, to: w, card: card });
      T.counts[wi] = (T.counts[wi] || 0) + 1;
      T.log.push({ text: SEAT_NAMES[w] + ' 从 ' + SEAT_NAMES[target] + ' 抽到 ' + suitRank(card), kind: 'draw' });
      if (w !== 0) aiReturnGift(T, w, target);
      return;
    }
    T.counts[wi] = (T.counts[wi] || 0) + 1;
  }

  function tributeStep() {
    tributeTimer = null;
    var T = S.tribute;
    if (!T || S.phase !== 'tribute') return;
    var job = aiJobPending(T);
    if (job) {
      doTributeDraw(T, job.wi, job.w);
      P.markDirty();
      tributeSchedule(AUTO ? 60 : 700);
      return;
    }
    // AI 抽完：真人赢家还要自己抽牌
    if (T.humanIsWinner && T.stage === 'draw' && T.humanDrawn.length < T.need) return;
    if (T.stage === 'draw') {
      T.stage = T.humanIsWinner ? 'return' : 'done';
      if (T.humanIsWinner) S.hint = '选 ' + T.need + ' 张还贡';
    }
    if (!T.humanIsWinner || T.stage === 'done') {
      // 抽完停顿一下，让人看清公示的牌
      if (!T.doneHold) {
        T.doneHold = true;
        P.markDirty();
        tributeSchedule(AUTO ? 120 : 1100);
        return;
      }
      finishTribute();
      return;
    }
    P.markDirty();
  }

  function finishTribute() {
    clearTributeTimer();
    var T = S.tribute;
    var lead = -1;
    if (S.cfg.tributeFirstLead === 'maxCardOwner' && T.draws.length) {
      var best = null;
      T.draws.forEach(function (d) {
        if (!best) { best = d; return; }
        var cmp = GX.Hand.compare(GX.Hand.parse([d.card], S.cfg), GX.Hand.parse([best.card], S.cfg));
        if (cmp > 0) best = d;
      });
      lead = best.from;
    }
    S.game.turn = lead;
    S.game.firstPlayPending = false;
    S.phase = 'play';
    S.tribute = null;
    S.selected = [];
    S.hint = lead >= 0 ? SEAT_NAMES[lead] + ' 被抽走最大牌，先出' : '';
    P.markDirty();
    scheduleAI();
  }

  // ---------- 结算 ----------
  function onNext() {
    if (S.mode === 'online') {
      if (!S.isHost) { toast('等房主开下一局'); return; }
      NET.send({ t: 'next' });
      return;
    }
    if (S.round >= S.rounds) {
      S.summary = true;
      S.phase = 'idle';
      clearTurnTimer();
      P.markDirty();
      return;
    }
    startRound();
  }

  // ---------- 触屏 ----------
  var drag = { on: false, add: true, seen: {} };

  // 手牌按牌力排好（3 最大、4 最小；同点黑桃优先）
  function sortHand(hand) {
    if (!hand || hand.length < 2) return hand;
    var RV = (GX.Rules && GX.Rules.rankVal)
      ? function (r) { return GX.Rules.rankVal(r, S.cfg.rankOrder); }
      : function (r) { return r; };
    hand.sort(function (a, b) {
      var d = RV(b.r) - RV(a.r);
      if (d) return d;
      return b.s - a.s;
    });
    return hand;
  }

  function handCardAt(i) {
    var g = S.game;
    if (!g || !g.players || !g.players[0]) return null;
    return g.players[0].hand[i] || null;
  }

  function isSelected(c) {
    return S.selected.some(function (s) { return s.r === c.r && s.s === c.s; });
  }

  function onDrag(x, y) {
    if (!drag.on || S.phase !== 'play') return;
    var hits = S.hits || [];
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i];
      if (h.act !== 'card') continue;
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
        if (drag.seen[h.i]) return;
        drag.seen[h.i] = 1;
        var c = handCardAt(h.i);
        if (!c) return;
        var sel = isSelected(c);
        if (drag.add && !sel) S.selected.push(c);
        else if (!drag.add && sel) {
          S.selected = S.selected.filter(function (s) { return !(s.r === c.r && s.s === c.s); });
        }
        P.markDirty();
        return;
      }
    }
  }

  function onDragEnd() {
    drag.on = false;
    drag.seen = {};
  }

  function onTap(x, y) {
    SFX.unlock();
    if (S.phase === 'deal') {
      if (S.mode === 'online') { S.deal = null; P.markDirty(); return; }
      finishDeal();
      return;
    }
    var hits = S.hits;
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
        if (h.act === 'card') {
          var c0 = handCardAt(h.i);
          if (c0 && S.tribute && S.tribute.stage === 'return') { toggleReturnSelect(c0); return; }
          if (c0) {
            drag.on = true;
            drag.add = !isSelected(c0);
            drag.seen = {};
            drag.seen[h.i] = 1;
          }
        }
        if (h.act !== 'card') SFX.play('tap');
        handleAct(h);
        return;
      }
    }
  }

  function handleAct(h) {
    if (h.act === 'startGame') { newMatch(); return; }
    if (h.act === 'netOpen') { openLobby(); return; }
    if (h.act === 'cfgRounds') {
      var ro = [8, 12, 16, 24, 32];
      S.rounds = ro[(ro.indexOf(S.rounds) + 1) % ro.length];
      P.markDirty();
      return;
    }
    if (h.act === 'cfgLevel') {
      S.level = (S.level + 1) % 3;
      P.markDirty();
      return;
    }
    if (h.act === 'cfgTribute') {
      if (!S.cfg.tributeEnabled) { S.cfg.tributeEnabled = true; S.cfg.tributeTier = 'heavy'; }
      else if (S.cfg.tributeTier === 'heavy') { S.cfg.tributeTier = 'light'; }
      else { S.cfg.tributeEnabled = false; }
      P.markDirty();
      return;
    }
    if (h.act === 'mode') {
      if (S.mode === 'online') backToSolo(); else openLobby();
      return;
    }
    if (h.act === 'netCreate') { netCreate(); return; }
    if (h.act === 'netConfig') {
      S.lobby = { kind: 'config', url: NET.defaultUrl(), err: '', code: '' };
      P.markDirty();
      return;
    }
    if (h.act === 'cfgSet') {
      if (h.key === 'rounds') S.rounds = h.v;
      else if (h.key === 'tribute') S.roomCfg.tributeTier = h.v;
      else if (h.key === 'seconds') S.roomCfg.turnSeconds = h.v;
      else if (h.key === 'hint') S.roomCfg.teamHint = h.v;
      else if (h.key === 'testTribute') S.roomCfg.testTribute = h.v;
      P.markDirty();
      return;
    }
    if (h.act === 'netCfgConfirm') { netCreate(); return; }
    if (h.act === 'netKeypad') { S.lobby = { kind: 'keypad', code: '', err: '' }; P.markDirty(); return; }
    if (h.act === 'netBack') { backToSolo(); return; }
    if (h.act === 'netDigit') {
      if (S.lobby && S.lobby.code.length < 4) S.lobby.code += h.d;
      P.markDirty();
      return;
    }
    if (h.act === 'netBackspace') {
      if (S.lobby) S.lobby.code = S.lobby.code.slice(0, -1);
      P.markDirty();
      return;
    }
    if (h.act === 'netCancel') {
      S.lobby = { kind: 'entry', url: NET.defaultUrl(), err: '', code: '' };
      P.markDirty();
      return;
    }
    if (h.act === 'netJoin') { if (S.lobby) netJoin(S.lobby.code); return; }
    if (h.act === 'netStart') { NET.send({ t: 'start' }); return; }
    if (h.act === 'netReady') { NET.send({ t: 'ready', v: !S.myReady }); return; }
    if (h.act === 'netLeave') { backToSolo(); return; }
    if (h.act === 'card') { tapCard(h.i); return; }
    if (h.act === 'play') { doPlay(); return; }
    if (h.act === 'pass') { doPass(); return; }
    if (h.act === 'hint') { doHint(); return; }
    if (h.act === 'drawSeat') { drawFromSeat(h.p); return; }
    if (h.act === 'pullCard') { pullOne(h.p, h.idx); return; }
    if (h.act === 'testTribute') { demoPullTest(); return; }
    if (h.act === 'confirmReturn') { confirmReturn(); return; }
    if (h.act === 'toMenu') {
      clearTurnTimer();
      clearTributeTimer();
      S.phase = 'menu';
      S.summary = false;
      S.game = null;
      S.deal = null;
      S.tribute = null;
      P.markDirty();
      return;
    }
    if (h.act === 'next') { onNext(); return; }
    if (h.act === 'round') {
      if (S.mode === 'online') { toast('房次由房主设置'); return; }
      var ro = [8, 12, 16, 24, 32];
      S.rounds = ro[(ro.indexOf(S.rounds) + 1) % ro.length];
      toast('场次：' + S.rounds + ' 局（下局生效）');
      return;
    }
    if (h.act === 'tier') {
      if (S.mode === 'online') { toast('进贡档位由房主设置'); return; }
      S.cfg.tributeTier = S.cfg.tributeTier === 'heavy' ? 'light' : 'heavy';
      toast('进贡：' + (S.cfg.tributeTier === 'heavy' ? '重贡 4/2' : '轻贡 2/1') + '（下局生效）');
      return;
    }
    if (h.act === 'level') {
      if (S.mode === 'online') { toast('联机对手是真人'); return; }
      S.level = (S.level + 1) % 3;
      toast('对手：' + ['新手', '普通', '高手'][S.level]);
      return;
    }
    if (h.act === 'audio') {
      S.audioOn = SFX.toggle();
      toast(S.audioOn ? '音效已开' : '音效已关');
      return;
    }
    if (h.act === 'newMatch') {
      if (S.mode === 'online') { toast('联机中不能重开，点标题可离开房间'); return; }
      if ((S.phase === 'play' || S.phase === 'tribute') && Date.now() > S.resetPending) {
        S.resetPending = Date.now() + 3000;
        toast('再点一次确认重开');
        return;
      }
      newMatch();
      toast('新的一场');
      return;
    }
  }

  function boot() {
    P.init();
    SFX.init();
    P.bindTap(onTap);
    if (P.bindMove) P.bindMove(onDrag);
    if (P.bindEnd) P.bindEnd(onDragEnd);
    P.start(draw);
    if (typeof window !== 'undefined') window.__gx = { S: S, P: P, onTap: onTap };
    if (typeof window !== 'undefined' && window.location &&
        /demo=pullTest/.test(window.location.search || '')) {
      demoPullTest();
      return;
    }
    if (typeof window !== 'undefined' && window.location &&
      /demo=tributeSeq/.test(window.location.search || '')) {
      // 预览用：真实走一遍第 2 局的进贡分步流程（真人不是赢家）
      S.mode = 'solo';
      S.rounds = 8;
      S.cfg.tributeEnabled = true;
      S.cfg.tributeTier = 'heavy';
      S.lastResult = { ranks: [1, 2, 0, 3], camp: { mode: 'team', teamA: [1, 2], teamB: [0, 3] } };
      S.round = 1;
      startRound();
      S.lastResult = { ranks: [1, 2, 0, 3], camp: { mode: 'team', teamA: [1, 2], teamB: [0, 3] } };
      S.round = 2;
      finishDeal();
      return;
    }
    if (typeof window !== 'undefined' && window.location &&
        /demo=tribute/.test(window.location.search || '')) { demoTribute(); return; }
    if (typeof window !== 'undefined' && window.location &&
        /demo=fx/.test(window.location.search || '')) { demoFx(); return; }
    if (typeof window !== 'undefined' && window.location &&
        /demo=flight/.test(window.location.search || '')) { demoFlight(); return; }
    if (typeof window !== 'undefined' && window.location &&
        /demo=lobby/.test(window.location.search || '')) { newMatch(); openLobby(); return; }
    if (typeof window !== 'undefined' && window.location &&
        /demo=cfg/.test(window.location.search || '')) {
      newMatch(); openLobby();
      S.lobby = { kind: 'config', url: NET.defaultUrl(), err: '', code: '' };
      S.mode = 'online'; P.markDirty(); return;
    }
    if (typeof window !== 'undefined' && window.location &&
        /demo=online/.test(window.location.search || '')) { demoOnline(); return; }
    if (typeof window !== 'undefined' && window.location &&
        /demo=keypad/.test(window.location.search || '')) {
      newMatch(); openLobby(); S.lobby = { kind: 'keypad', code: '12', err: '' }; P.markDirty(); return;
    }

    var joinCode = '';
    if (typeof window !== 'undefined' && window.location) {
      var qm = /(?:\?|&)room=(\d{4})/.exec(window.location.search || '');
      if (qm) joinCode = qm[1];
    }
    if (joinCode) {
      S.phase = 'menu';
      openLobby();
      netJoin(joinCode);
      return;
    }
    if (AUTO) { newMatch(); return; }
    S.phase = 'menu';
    P.markDirty();
  }

  // 仅预览用：把对局推进到桌面已有 3 手，并冻结在飞牌动画中途
  function demoFx() {
    var m = /fx=([0-9.]+)/.exec(window.location.search || '');
    var km = /kind=([a-z]+)/.exec(window.location.search || '');
    newMatch();
    S.fxDemoP = m ? parseFloat(m[1]) : 0.35;
    S.fxDemoKind = km ? km[1] : '';
    P.markDirty();
  }

  function demoFlight() {
    S.game = GX.Table.createRound({ seed: 11, config: S.cfg });
    S.phase = 'play';
    var g = S.game, guard = 0;
    while (g.trickPlays.length < 3 && guard++ < 30 && !g.over) {
      var p = g.turn;
      var a = GX.AI2.decide(g, p, 1);
      if (a.type === 'play') GX.Table.play(g, p, a.cards);
      else if (GX.Table.pass(g, p)) {
        var ok = GX.Moves.candidates(g.players[p].hand, S.cfg)
          .filter(function (c) { return GX.Table.validate(g, p, c.cards) === null; });
        if (ok.length) GX.Table.play(g, p, GX.Moves.lowest(ok).cards);
      }
    }
    S.players = null;
    S.fx = { playT0: Date.now(), seatPlay: { p: g.trickPlays[g.trickPlays.length - 1].player, t0: Date.now() } };
    S.fxForce = 0.3;
    P.markDirty();
  }

        drawn.forEach(function (d) {

        });
        sortHand(S.game.players[0].hand);
        S.tribute.draws = drawn;
        S.tribute.retQueue = drawn.slice().sort(function (a, b) {
          return GX.Rules.rankVal(b.card.r, S.cfg.rankOrder) - GX.Rules.rankVal(a.card.r, S.cfg.rankOrder);
        });

      }
